# Run tests on every pull request and push to main.
# Uses uv for fast dependency installation.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Install project with dev dependencies
        # Uses the committed uv.lock for a reproducible install — a plain
        # `uv pip install -e ".[dev]"` re-resolves unpinned deps on every
        # run, so a new upstream major release (e.g. pulp 4.0, which broke
        # LpVariable's lowBound/upBound kwargs) can silently break CI even
        # though nothing in this repo changed.
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
