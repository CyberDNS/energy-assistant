[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nornwatt"
version = "0.1.3"
description = "Open-source, vendor-neutral energy management platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "aiosqlite>=0.19",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pulp>=3.0,<4.0",  # pulp 4.0 renamed LpVariable's lowBound/upBound kwargs — breaks optimizer.py
    "highspy>=1.7",
    "fastapi>=0.115",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "aiomqtt>=2.0",
    "websockets>=13",
    "pymodbus>=3.8",
    "mcp>=1.10",
    "smllib>=1.7",
    "ruamel-yaml>=0.18",
]

[project.scripts]
nornwatt = "nornwatt.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/energy_manager", "src/nornwatt"]
# The built web UI (`npm run build` in frontend/); git ignores it, the wheel ships it.
artifacts = ["src/nornwatt/frontend/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
