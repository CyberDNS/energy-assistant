title: Huawei LUNA2000 battery (Huawei Solar integration)
category: battery
integration: Huawei Solar (custom, wlcrs/huawei_solar)
url: https://github.com/wlcrs/huawei_solar
verified: false
description: >-
  Nornwatt sets the working mode and the maximum charge and discharge power.
  The battery can then cover the house, store PV surplus only, or hold its
  charge. It cannot be charged from the grid this way: when the plan charges
  from the grid, the battery stores PV surplus only. The integration needs
  "elevated permissions". Check that the charge/discharge power is positive
  while the battery charges, and turn on Invert sign if it is not. Replace the
  two power limits of 5000 W with the maximum of your battery.
variables:
  prefix:
    label: Battery prefix (the start of its entity ids)
    example: batteries
device:
  type: homeassistant_battery
  capabilities:
    power_w: { entity: "sensor.{prefix}_charge_discharge_power" }
    soc_pct: { entity: "sensor.{prefix}_state_of_capacity" }
    power_setpoint:
      control: modes
      mode: "select.{prefix}_working_mode"
      modes:
        self_consumption:
          option: maximise_self_consumption
          set:
            "number.{prefix}_maximum_charging_power": 5000
            "number.{prefix}_maximum_discharging_power": 5000
        absorb_surplus:
          option: maximise_self_consumption
          set:
            "number.{prefix}_maximum_charging_power": 5000
            "number.{prefix}_maximum_discharging_power": 0
        hold:
          option: maximise_self_consumption
          set:
            "number.{prefix}_maximum_charging_power": 0
            "number.{prefix}_maximum_discharging_power": 0
      release: self_consumption
  params: { capacity_kwh: 10, max_charge_kw: 5, max_discharge_kw: 5, min_soc_pct: 5 }
