title: Hot-water tank (water heater entity)
category: thermal_load
integration: any water_heater entity (Home Assistant core)
url: https://www.home-assistant.io/integrations/water_heater/
verified: false
description: >-
  Nornwatt heats the tank to the top threshold in cheap or PV hours
  and lets it drift down to the bottom one otherwise; the normal target is
  put back when it stops.  Running is taken from the last command (water
  heaters report no hvac_action): bind power_w to the heater's power sensor
  if there is one.
variables:
  heater:
    label: Water heater entity (without "water_heater.")
    example: heat_pump
device:
  type: homeassistant_thermostat
  capabilities:
    temperature_c: { entity: "water_heater.{heater}", attribute: current_temperature }
    power_setpoint:
      control: water_heater
      entity: "water_heater.{heater}"
      normal: 50
  params:
    bottom_threshold: 45
    top_threshold: 55
    direction: increases
    rated_power_w: 1800
    active_rate_per_h: 8
    drift_rate_per_h: 0.6
    min_runtime_h: 0.5
