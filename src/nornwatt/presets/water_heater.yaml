title: Hot-water tank (water heater entity)
category: thermal_load
integration: any water_heater entity (Home Assistant core)
url: https://www.home-assistant.io/integrations/water_heater/
verified: false
description: >-
  Nornwatt heats the tank to the upper threshold in cheap or sunny hours and
  lets it cool down to the lower threshold otherwise. It puts back your normal
  target when it stops controlling. A water heater does not report whether it
  is heating, so Nornwatt assumes it follows the last command. If the heater
  has a power sensor, choose it under Power.
variables:
  heater:
    label: Water heater (the entity id without "water_heater.")
    example: heat_pump
device:
  type: homeassistant_thermostat
  capabilities:
    temperature_c: { entity: "water_heater.{heater}", attribute: current_temperature }
    power_setpoint:
      control: water_heater
      entity: "water_heater.{heater}"
      normal: 50
  params:
    bottom_threshold: 45
    top_threshold: 55
    direction: increases
    rated_power_w: 1800
    active_rate_per_h: 8
    drift_rate_per_h: 0.6
    min_runtime_h: 0.5
