title: openWB chargepoint (openWB 2 integration)
category: charger
integration: openWB 2 (MQTT) for Home Assistant
url: https://github.com/a-reinhard/openwb2mqtt
verified: true
description: >-
  Nornwatt switches the charge mode of the openWB. In PV Charging the openWB
  follows the PV surplus itself. The entity ids are those of a Home Assistant
  set to German. With another language they differ: check them in Home
  Assistant under Settings → Entities. Set the Default vehicle of the charger
  and, for every car, its ID in the charger system.
variables:
  prefix:
    label: Chargepoint prefix (the start of its entity ids)
    example: openwbbox_chargepoint_5
device:
  type: homeassistant_charger
  settings: { phases: 3 }
  capabilities:
    power_w: { entity: "sensor.{prefix}_ladeleistung" }
    plugged: { entity: "binary_sensor.{prefix}_ladekabel" }
    power_setpoint:
      control: modes
      mode: "select.{prefix}_lademodus"
      modes:
        charge: { option: Instant Charging, current: "number.{prefix}_soll_ladestrom_sofortladen" }
        absorb_surplus: { option: PV Charging }
        stop: { option: Stop }
      soc_limit: "number.{prefix}_soc_limit_sofortladen"
      max_current_a: 16
  params: { min_power_kw: 4.14, max_power_kw: 11 }
