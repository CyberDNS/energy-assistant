title: go-e Charger (go-eCharger API v2 integration)
category: charger
integration: go-eCharger API v2 (custom, marq24/ha-goecharger-api2)
url: https://github.com/marq24/ha-goecharger-api2
verified: false
description: >-
  The "Force state" select starts and stops charging, and the requested
  current sets the power. The charger has no PV mode Nornwatt can use, so
  Nornwatt follows the PV surplus itself by changing the current. On your
  installation the options of the select may be named Charge and Don't charge
  instead of 2 and 1: compare them with the options the select offers. When
  Nornwatt stops, the charger keeps its last state. Set Force state to Neutral
  by hand to give the charger back its own logic. Not yet checked on a real
  go-e Charger.
variables:
  serial:
    label: Serial number (as in the entity ids, goe_<serial>_…)
    example: "123456"
device:
  type: homeassistant_charger
  settings: { phases: 3 }
  capabilities:
    power_w: { entity: "sensor.goe_{serial}_nrg_11" }
    plugged: { entity: "binary_sensor.goe_{serial}_car_0" }
    power_setpoint:
      control: modes
      mode: "select.goe_{serial}_frc"
      modes:
        charge: { option: "2", current: "number.goe_{serial}_amp" }
        stop: { option: "1" }
      max_current_a: 16
  params: { min_power_kw: 4.14, max_power_kw: 11 }
