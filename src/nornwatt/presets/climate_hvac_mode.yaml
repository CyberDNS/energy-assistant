title: Heater with a thermostat (on / off by HVAC mode)
category: thermal_load
integration: any climate entity (Home Assistant core)
url: https://www.home-assistant.io/integrations/climate/
verified: true
description: >-
  Nornwatt switches the thermostat between heat and off; the
  thermostat keeps its own target while on.  Set the thresholds, rates and
  the heater's power under Parameters.  Learning needs plain sensors: set
  learning.value_entity, or turn learning off.
variables:
  climate:
    label: Climate entity (without "climate.")
    example: living_room
device:
  type: homeassistant_thermostat
  capabilities:
    temperature_c: { entity: "climate.{climate}", attribute: current_temperature }
    power_setpoint:
      control: hvac_mode
      entity: "climate.{climate}"
      run_mode: heat
      stop_mode: "off"
      normal: heat
  params:
    bottom_threshold: 19
    top_threshold: 22
    direction: increases
    rated_power_w: 2000
    active_rate_per_h: 1.0
    drift_rate_per_h: 0.3
    min_runtime_h: 0.25
    min_offtime_h: 0.25
