title: SolarEdge battery (SolarEdge Modbus Multi integration)
category: battery
integration: SolarEdge Modbus Multi (custom, WillCodeForCats)
url: https://github.com/WillCodeForCats/solaredge-modbus-multi
verified: false
description: >-
  Nornwatt uses the inverter's Remote Control storage mode: it sets a storage
  command mode for what the battery should do, and the charge or discharge
  limit as the power. Enable "Storage Control" in the integration and set
  Storage Default Mode to Maximize Self Consumption. The inverter goes back to
  that mode by itself an hour after the last command, so the battery is safe
  if Nornwatt stops. Check that the battery's DC power is positive while it
  charges, and turn on Invert sign if it is not.
variables:
  prefix:
    label: Entity prefix (the name prefix set in the integration)
    example: solaredge
device:
  type: homeassistant_battery
  capabilities:
    power_w: { entity: "sensor.{prefix}_b1_dc_power" }
    soc_pct: { entity: "sensor.{prefix}_b1_state_of_energy" }
    power_setpoint:
      control: modes
      mode: "select.{prefix}_i1_storage_command_mode"
      modes:
        charge:
          option: Charge from Solar Power and Grid
          power: "number.{prefix}_i1_storage_charge_limit"
          set: &remote
            "select.{prefix}_i1_storage_control_mode": Remote Control
            "number.{prefix}_i1_storage_command_timeout": 3600
        discharge:
          option: Discharge to Maximize Export
          power: "number.{prefix}_i1_storage_discharge_limit"
          set: *remote
        absorb_surplus: { option: Charge from Solar Power, set: *remote }
        self_consumption: { option: Maximize Self Consumption, set: *remote }
        hold: { option: Solar Power Only (Off), set: *remote }
      release: self_consumption
  params: { capacity_kwh: 9.7, max_charge_kw: 5, max_discharge_kw: 5, min_soc_pct: 5 }
