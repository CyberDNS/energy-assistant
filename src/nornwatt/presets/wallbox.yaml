title: Wallbox charger (Wallbox integration)
category: charger
integration: Wallbox (Home Assistant core)
url: https://www.home-assistant.io/integrations/wallbox/
verified: false
description: >-
  Nornwatt sets the charging current and uses the Pause/resume switch to
  start and stop. It follows the PV surplus itself by changing the current.
  The entity ids are built from the name of the device: check them in Home
  Assistant under Settings → Entities. Not yet checked on a real Wallbox.
variables:
  prefix:
    label: Entity prefix (the name of the device)
    example: wallbox_pulsar_plus
device:
  type: homeassistant_charger
  settings: { phases: 3 }
  capabilities:
    power_w: { entity: "sensor.{prefix}_charging_power" }
    plugged:
      entity: "sensor.{prefix}_status_description"
      "on":
        - Charging
        - Paused
        - Scheduled
        - Waiting for car demand
        - Waiting
        - Locked, car connected
        - Waiting in queue by Power Sharing
        - Waiting in queue by Power Boost
        - Waiting in queue by Eco-Smart
    power_setpoint:
      control: current
      current: "number.{prefix}_maximum_charging_current"
      enable: "switch.{prefix}_pause_resume"
      max_current_a: 32
  params: { min_power_kw: 4.14, max_power_kw: 11 }
